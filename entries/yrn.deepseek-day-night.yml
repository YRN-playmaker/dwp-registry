description: 按本地时间自动切换的两张全画布壁纸：18:00–06:00 显示夜景图，其余时间显示日景图，边界前后各 10 分钟线性过渡，看不到硬切。渲染模式「预览 / 捕获」用 1920×1080 图，「增强 / 完整」自动切到 7680×4320 高清图（低档位不下载高清纹理）。 新增配套插件侧边栏效果：使用 dsh-wallpaper_share 26.10.9-D 或新版，挂载后悬停蓝底，选中项显示深色游鱼；品牌按钮除外。仅更新 DWP 不会为旧版插件启用此效果。

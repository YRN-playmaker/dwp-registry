description: DeepSeek 日夜 1.3.2：预览水下页面固定白天蓝色与低开销效果；完整模式提供二维形变气泡、1.35 倍人物细节窗口、最多 12 个常驻气泡、水面焦散、滚轮下潜与退出过渡。夜间为柔和暖红水体、深酒红完整剪影、珊瑚红交互和橙金水花；专注加完整启用 1–4px 呼吸模糊。需配套插件 26.10.13-D 并重启；素材和参数随 DWP 分发，标准播放器保留日夜背景和 SD/8K 纹理。

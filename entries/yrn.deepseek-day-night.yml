description: 日夜壁纸保留本地时间自动切换与 SD/8K 纹理；入水展开、水花、倒置人物深度渐变、滚轮下潜和退出动画随 DWP 分发。1.3.1 减轻侧边栏遮罩，并配套修复深浅主题与页面切换过渡。水面光斑固定顶端，随下潜淡出；「完整」模式开启焦散和泡泡照明，专注 + 完整启用 1–4px 呼吸模糊。页面修复需安装本次 Release 附带的 26.10.12-D-daynight-1.3.1 插件包并重启；标准 DWP 播放器保留日夜背景。
